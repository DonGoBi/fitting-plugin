<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #111;
      --card: #1a1a1a;
      --accent: #00d4ff;
    }
    body { 
      width: 180px; margin: 0; padding: 24px 12px; 
      font-family: sans-serif; background: var(--bg); color: white;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 {
      font-size: 16px; font-weight: 800; margin: 0 0 20px 0;
      letter-spacing: 0.5px; color: #eee;
    }

    .container {
      width: 100%; background: var(--card); padding: 18px 0;
      border-radius: 12px; border: 1px solid #333;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }

    .label { font-size: 11px; font-weight: 600; color: #666; }

    /* 토글 스위치 디자인 */
    .switch {
      position: relative; display: inline-block; width: 50px; height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333; transition: .3s; border-radius: 30px;
    }
    
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px;
      left: 3px; bottom: 3px; background-color: #888; transition: .3s; border-radius: 50%;
    }
    
    input:checked + .slider { background-color: #222; border: 1px solid var(--accent); }
    input:checked + .slider:before {
      transform: translateX(24px); background-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }

    .footer { margin-top: 18px; font-size: 9px; color: #444; }
  </style>
</head>
<body>
  <h1>V-FITTING</h1>
  
  <div class="container">
    <div class="label" id="status-text">OFF</div>
    <label class="switch">
      <input type="checkbox" id="toggle-extension">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">v1.0.0 Stable</div>
  <script src="popup.js"></script>
</body>
</html>
